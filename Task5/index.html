<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A simple Single Page Application student dashboard."
    >

    <title>StudentHub - SPA Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="brand">
                <div class="brand-icon">S</div>
                <span>StudentHub</span>
            </div>


            <nav class="navigation" aria-label="Main navigation">

                <a
                    href="/dashboard"
                    data-route="/dashboard"
                    class="nav-link active"
                >
                    <span>⌂</span>
                    Dashboard
                </a>

                <a
                    href="/courses"
                    data-route="/courses"
                    class="nav-link"
                >
                    <span>▣</span>
                    Courses
                </a>

                <a
                    href="/assignments"
                    data-route="/assignments"
                    class="nav-link"
                >
                    <span>✓</span>
                    Assignments
                </a>

                <a
                    href="/profile"
                    data-route="/profile"
                    class="nav-link"
                >
                    <span>●</span>
                    Profile
                </a>

            </nav>


            <div class="sidebar-footer">

                <p>Student Portal</p>

                <small>
                    SPA Demo Project
                </small>

            </div>

        </aside>


        <!-- MAIN AREA -->

        <div class="main-wrapper">

            <header class="topbar">

                <div>

                    <p class="topbar-label">
                        Student Dashboard
                    </p>

                    <h1 id="page-title">
                        Dashboard
                    </h1>

                </div>


                <div class="user-info">

                    <div class="avatar">
                        V
                    </div>

                    <div>

                        <strong>
                            Vedant
                        </strong>

                        <small>
                            B.Tech Student
                        </small>

                    </div>

                </div>

            </header>


            <!-- DYNAMIC CONTENT -->

            <main
                id="app-content"
                class="content"
            >
                <!-- JavaScript dynamically inserts content here -->
            </main>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
